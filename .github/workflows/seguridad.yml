# Seguridad (N04, N05, N06, N12): cada paso debe probar que analizó algo, no sólo que terminó.
# Baremo lo verifica sobre este mismo archivo con la sonda entrega.check-que-analiza.
name: seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # lunes: también se revisa lo que no cambió (CVE nuevas)

permissions:
  contents: read

jobs:
  confidencialidad:
    name: confidencialidad (sin datos de clientes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # La lista de términos vive en el secreto del repo, nunca en el código; el reporte no imprime términos.
      # Sale con 2 si no hay lista o si no revisó ningún archivo: no se aprueba por no mirar.
      - run: python herramientas/confidencialidad.py
        env:
          CONFIDENCIAL_TERMINOS: ${{ secrets.CONFIDENCIAL_TERMINOS }}

  secretos:
    name: secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0        # toda la historia: un secreto borrado sigue en Git
      # Imagen oficial con versión fija (la misma que .pre-commit-config.yaml). Se corre con el usuario del
      # runner para que git no rechace el árbol montado por «dubious ownership».
      - name: gitleaks sobre toda la historia
        shell: bash             # bash con pipefail: el código de salida de gitleaks sobrevive al tee
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --verbose --exit-code 1
          2>&1 | tee gitleaks.log
      # La acción oficial termina en verde aunque no haya escaneado un solo commit: se exige verlo en el log.
      - name: probar que escaneó commits
        if: always()
        run: grep -Eq '[1-9][0-9]* commits scanned' gitleaks.log

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # CodeQL termina con error si no extrae ningún archivo del lenguaje («no source code was seen»).
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3

  semgrep:
    name: SAST (Semgrep, bloqueante)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Excepción declarada (vence 2027-02-19): herramientas/verificar_reportes.py es copia literal de la
      # plantilla común y usa xml.etree para leer el JUnit que produce este mismo CI (entrada confiable).
      # La regla use-defused-xml-parse lo marca; el arreglo va en la plantilla, no en la copia.
      - run: >-
          semgrep scan --config p/default --error --metrics=off
          --sarif-output=semgrep.sarif --json-output=semgrep.json
      - name: probar que analizó archivos
        if: always()
        run: python3 herramientas/verificar_reportes.py semgrep semgrep.json
      # lo suprimido en el código (nosemgrep con su motivo) no se sube: GitHub lo contaría como alerta abierta
      - name: depurar SARIF
        if: always()
        run: python3 herramientas/verificar_reportes.py depurar-sarif semgrep.sarif
      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependencias:
    name: dependencias e IaC (Trivy, bloqueante en CRITICAL/HIGH con arreglo)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: inventario (prueba de que hay qué analizar)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          format: json
          output: trivy.json
          list-all-pkgs: 'true'
          exit-code: '0'
      - run: python3 herramientas/verificar_reportes.py trivy trivy.json
      - name: vulnerabilidades (bloqueante)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          ignore-unfixed: 'true'
          trivyignores: .trivyignore     # cada excepción con fecha de vencimiento y motivo
          exit-code: '1'
          format: sarif
          output: trivy.sarif
          # Sin esto, con format=sarif la acción descarta `severity` y bloquea con cualquier severidad.
          limit-severities-for-sarif: 'true'
      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: configuración e IaC
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          severity: CRITICAL,HIGH
          exit-code: '1'

  sbom:
    name: SBOM (syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      - run: python3 herramientas/verificar_reportes.py sbom sbom.spdx.json
