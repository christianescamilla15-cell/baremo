version: 2
updates:
  # requirements.txt y requirements-dev.txt fijan cada versión; Dependabot propone las nuevas por PR.
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:                       # menores y parches juntos: un PR por semana; las mayores van solas
      pip-menores:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:                       # menores y parches juntos: un PR por semana; las mayores van solas
      acciones-menores:
        update-types: [minor, patch]
